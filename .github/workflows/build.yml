name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python make
      - run: make windows WINDOWS_CC=gcc
      - run: python -m unittest discover -s tests -v
      - name: Package Windows binaries
        shell: pwsh
        run: Compress-Archive -Path spotify-filter.exe, spotify-filter.dll, README.md, LICENSE -DestinationPath spotify-filter-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-filter-windows-x64
          path: spotify-filter-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
      - run: bash -n spotify-filter
      - name: Package Linux binaries
        run: tar -czf spotify-filter-linux-x64.tar.gz spotify-filter spotify-filter.so README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-filter-linux-x64
          path: spotify-filter-linux-x64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spotify-filter-*
          merge-multiple: true
          path: dist
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
