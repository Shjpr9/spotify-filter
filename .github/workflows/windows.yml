name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python make
      - run: make windows WINDOWS_CC=gcc
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-filter-windows-x64
          path: |
            spotify-filter.exe
            spotify-filter.dll
